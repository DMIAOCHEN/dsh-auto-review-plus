name: ci

on:
  push:
  pull_request:

# Least privilege, matching the explicit style of publish.yml: this job only
# reads the checkout. No token is needed anywhere in it.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify committed artifacts match a fresh build
        run: |
          if [ -n "$(git status --porcelain -- lib)" ]; then
            git status --short -- lib
            git diff -- lib
            echo "::error::lib/ is stale — run 'npm run build' and commit the result"
            exit 1
          fi

      # The drift check above only covers lib/. A file missing from `files`, or
      # an entry point pointing at something that was never committed, would
      # ship silently and only surface for users of the published package (a
      # dangling `exports["./client"]` breaks in the browser, after install).
      # The guard is one file so this workflow and publish.yml cannot drift
      # apart; it runs `npm pack --dry-run` and uploads nothing.
      - name: Verify the manifest entry points and the packed file list
        run: node .github/scripts/verify-pack.mjs

      # publish.yml upgrades npm before it runs the same guard, so a `npm pack
      # --json` shape change in a newer npm would only surface on a release tag —
      # and it did: npm 11 returns an object KEYED BY PACKAGE NAME, the guard
      # rejected a good report, and the v0.1.0 release went red while this job
      # (Node 22's bundled npm 10) stayed green. Run the guard once more under the
      # very npm the release uses, and print the version so the log proves which.
      - name: Verify the pack guard under the publish npm version
        run: |
          npm install -g npm@latest
          npm --version
          node .github/scripts/verify-pack.mjs

      # The drift check compares artifacts to a fresh build, so it cannot tell a
      # valid artifact from a broken one. This reads the COMMITTED client bundle
      # and rejects CSS class names that are not legal identifiers — a class
      # selector starting with a digit is dropped by the browser in silence, so
      # the surface renders unstyled with every other check still green.
      - name: Verify the client bundle's CSS class names
        run: node .github/scripts/verify-client-css.mjs
