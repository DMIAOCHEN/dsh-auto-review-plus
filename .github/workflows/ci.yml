name: ci

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Verify committed artifacts match a fresh build
        run: |
          test -z "$(git status --porcelain -- lib)" \
            || { git status --porcelain -- lib; echo "::error::lib/ is stale — run 'npm run build' and commit the result"; exit 1; }
